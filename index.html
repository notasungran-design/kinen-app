<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きんえんカウンター</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="きんえん">
<meta name="theme-color" content="#EAF7F2">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Roboto+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg:#EAF7F2; --ink:#23413A; --sub:#6F8A83; --acc:#23A487; --acc2:#FFB547; --card:#fff; --line:#D5EAE2; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { text-align: center; font-size: 1.3rem; margin: 6px 0 14px; }
  h2 { font-size: 1rem; margin: 22px 0 8px; }
  .hide { display: none !important; }
  .box { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 10px; }
  .note { font-size: .78rem; color: var(--sub); line-height: 1.6; }
  label { display: block; font-size: .9rem; margin: 12px 0 4px; font-weight: 800; }
  input { font-family: inherit; font-size: 1rem; padding: 12px; border-radius: 12px; border: 2px solid var(--line); width: 100%; color: var(--ink); background: #fff; }
  button { font-family: inherit; font-size: 1rem; font-weight: 800; border: none; border-radius: 14px; padding: 14px; cursor: pointer; width: 100%; }
  .main { background: var(--acc); color: #fff; margin-top: 14px; }
  .sub { background: #DCEFE8; color: var(--ink); margin-top: 10px; }
  .soft { background: #fff; color: var(--sub); border: 2px solid var(--line); margin-top: 10px; }

  /* 経過時間 */
  .hero { text-align: center; background: var(--card); border-radius: 22px; padding: 20px 16px; }
  .hero .lbl { color: var(--sub); font-size: .9rem; }
  .hero .days { font-size: 3.4rem; font-weight: 800; color: var(--acc); line-height: 1.1; }
  .hero .days small { font-size: 1.2rem; margin-left: 4px; }
  .hero .clock { font-family: "Roboto Mono", monospace; font-size: 1.4rem; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .stat { background: var(--card); border-radius: 18px; padding: 14px; text-align: center; }
  .stat .v { font-size: 1.6rem; font-weight: 800; }
  .stat .l { font-size: .8rem; color: var(--sub); }

  .goal .bar { height: 14px; background: #EEF5F2; border-radius: 7px; overflow: hidden; margin: 8px 0 4px; }
  .goal .bar i { display: block; height: 100%; background: var(--acc2); border-radius: 7px; transition: width .5s; }

  .craving { background: #FF8A65; color: #fff; font-size: 1.15rem; padding: 18px; margin-top: 14px; border-radius: 18px; }

  .mile { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .mile:last-child { border-bottom: none; }
  .mile .ic { font-size: 1.3rem; width: 28px; text-align: center; }
  .mile .t { font-weight: 800; font-size: .9rem; }
  .mile .d { font-size: .85rem; color: var(--sub); }
  .mile.done .t { color: var(--acc); }
  .mile.next { background: #F4FBF8; border-radius: 12px; padding: 10px; }

  /* 深呼吸 */
  #breath { position: fixed; inset: 0; background: rgba(35,65,58,.92); color: #fff; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .circle { width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.18); border: 4px solid #9FE3D0;
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; transition: transform 4s ease-in-out; }
  #breath .left { font-family: "Roboto Mono", monospace; font-size: 1.1rem; margin-top: 26px; opacity: .8; }
  #breath .tips { font-size: .9rem; opacity: .85; margin-top: 18px; line-height: 1.8; }
  #breath button { max-width: 280px; margin-top: 12px; }

  #toast { position: fixed; left: 50%; top: calc(20px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; display: none; font-weight: 800; z-index: 30; }
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <h1>🌱 きんえんカウンター</h1>

  <!-- ===== はじめての設定 ===== -->
  <section id="vSetup" class="hide">
    <div class="box">
      <label>やめた日時</label>
      <input id="sStart" type="datetime-local">
      <label>1日にすっていた本数</label>
      <input id="sPerDay" type="number" inputmode="numeric" value="20">
      <label>1箱の値段（円）</label>
      <input id="sPrice" type="number" inputmode="numeric" value="600">
      <label>1箱の本数</label>
      <input id="sPerPack" type="number" inputmode="numeric" value="20">
      <label>ごほうび目標（なくてもOK）</label>
      <input id="sGoalName" placeholder="例：新しいスニーカー">
      <input id="sGoalPrice" type="number" inputmode="numeric" placeholder="金額（円）" style="margin-top:8px">
    </div>
    <button class="main" onclick="saveSetup()">スタート</button>
    <p class="note">※データはこのスマホの中だけに保存されます。</p>
  </section>

  <!-- ===== メイン ===== -->
  <section id="vMain" class="hide">
    <div class="hero">
      <div class="lbl">すわずに</div>
      <div class="days"><span id="days">0</span><small>日</small></div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v" id="saved">¥0</div><div class="l">うかせたお金</div></div>
      <div class="stat"><div class="v" id="notSmoked">0本</div><div class="l">すわなかった本数</div></div>
      <div class="stat"><div class="v" id="win">0回</div><div class="l">がまんできた回数</div></div>
      <div class="stat"><div class="v" id="best">0日</div><div class="l">さいちょう記録</div></div>
    </div>

    <div class="box goal" id="goalBox" style="margin-top:10px">
      <b>🎁 <span id="goalName"></span></b>
      <div class="bar"><i id="goalBar" style="width:0"></i></div>
      <div class="note" id="goalText"></div>
    </div>

    <button class="craving" onclick="startBreath()">😣 すいたくなった！</button>

    <h2>からだの回復のめやす</h2>
    <div class="box" id="miles"></div>
    <p class="note">※WHOなどが紹介している一般的なめやすです。個人差があります。</p>

    <button class="sub" onclick="openSettings()">⚙ せってい</button>
    <button class="soft" onclick="slipped()">すってしまった…</button>
  </section>

  <!-- ===== せってい ===== -->
  <section id="vSettings" class="hide">
    <div class="box">
      <label>1日にすっていた本数</label>
      <input id="ePerDay" type="number" inputmode="numeric">
      <label>1箱の値段（円）</label>
      <input id="ePrice" type="number" inputmode="numeric">
      <label>1箱の本数</label>
      <input id="ePerPack" type="number" inputmode="numeric">
      <label>ごほうび目標</label>
      <input id="eGoalName" placeholder="例：新しいスニーカー">
      <input id="eGoalPrice" type="number" inputmode="numeric" placeholder="金額（円）" style="margin-top:8px">
    </div>
    <button class="main" onclick="saveSettings()">ほぞんしてもどる</button>
    <button class="soft" onclick="show('vMain')">キャンセル</button>
    <button class="soft" style="color:#d9534f" onclick="resetAll()">すべてのデータをけす</button>
  </section>
</div>

<!-- ===== 深呼吸 ===== -->
<div id="breath" class="hide">
  <div class="circle" id="circle">すって</div>
  <div class="left" id="left">60</div>
  <div class="tips">すいたい気持ちは、たいてい数分でおさまります。<br>水をのむ・歯をみがく・少し歩く、もおすすめ。</div>
  <button class="main" onclick="endBreath(true)">のりこえた！</button>
  <button class="soft" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)" onclick="endBreath(false)">とじる</button>
</div>

<script>
const KEY = 'kinen-v1';
// からだの回復のめやす（分）
const MILES = [
  { m: 20, t: '20分', d: '心拍数と血圧が下がりはじめる' },
  { m: 60 * 12, t: '12時間', d: '血液中の一酸化炭素がふつうのレベルにもどる' },
  { m: 60 * 24 * 14, t: '2週間〜3か月', d: '血のめぐりがよくなり、肺のはたらきが高まる' },
  { m: 60 * 24 * 30, t: '1〜9か月', d: 'せきや息切れがへっていく' },
  { m: 60 * 24 * 365, t: '1年', d: '心臓病のリスクが、すっている人の約半分に' },
  { m: 60 * 24 * 365 * 5, t: '5年', d: '脳卒中のリスクが下がっていく' },
  { m: 60 * 24 * 365 * 10, t: '10年', d: '肺がんで亡くなるリスクが、すっている人の約半分に' },
];

let s = load();
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { toast('ほぞんできませんでした'); } }

function show(id) {
  ['vSetup', 'vMain', 'vSettings'].forEach(v => document.getElementById(v).classList.toggle('hide', v !== id));
  if (id === 'vMain') tick();
  window.scrollTo(0, 0);
}

// ===== はじめての設定 =====
function toLocalInput(t) {
  const d = new Date(t - new Date().getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
}
function num(id) { return parseFloat(document.getElementById(id).value) || 0; }
function saveSetup() {
  const start = new Date(document.getElementById('sStart').value).getTime();
  if (!start || start > Date.now()) return toast('やめた日時をたしかめてね');
  if (num('sPerDay') <= 0 || num('sPrice') <= 0 || num('sPerPack') <= 0) return toast('本数と値段をいれてね');
  s = {
    start, perDay: num('sPerDay'), price: num('sPrice'), perPack: num('sPerPack'),
    goalName: document.getElementById('sGoalName').value.trim(), goalPrice: num('sGoalPrice'),
    wins: 0, best: 0, slips: [],
  };
  save(); show('vMain');
}

// ===== 毎秒の表示 =====
const yen = n => '¥' + Math.floor(n).toLocaleString('ja-JP');
function tick() {
  if (!s) return;
  const ms = Math.max(0, Date.now() - s.start);
  const days = ms / 86400000;
  const sec = Math.floor(ms / 1000);
  document.getElementById('days').textContent = Math.floor(days);
  document.getElementById('clock').textContent =
    [Math.floor(sec / 3600) % 24, Math.floor(sec / 60) % 60, sec % 60].map(n => String(n).padStart(2, '0')).join(':');

  const cigs = days * s.perDay;
  const money = cigs * s.price / s.perPack;
  document.getElementById('saved').textContent = yen(money);
  document.getElementById('notSmoked').textContent = Math.floor(cigs).toLocaleString('ja-JP') + '本';
  document.getElementById('win').textContent = s.wins + '回';
  document.getElementById('best').textContent = Math.floor(Math.max(s.best, days)) + '日';

  // ごほうび目標
  const g = document.getElementById('goalBox');
  if (s.goalName && s.goalPrice > 0) {
    g.classList.remove('hide');
    const r = Math.min(1, money / s.goalPrice);
    document.getElementById('goalName').textContent = s.goalName;
    document.getElementById('goalBar').style.width = (r * 100) + '%';
    document.getElementById('goalText').textContent = r >= 1
      ? `${yen(s.goalPrice)} たまりました！ごほうびを買いにいこう 🎉`
      : `${yen(money)} / ${yen(s.goalPrice)}（あと ${yen(Math.ceil(s.goalPrice - money))}・約${Math.ceil((s.goalPrice - money) / (s.perDay * s.price / s.perPack))}日）`;
  } else g.classList.add('hide');

  // 回復のめやす
  const min = ms / 60000;
  const nextIdx = MILES.findIndex(x => min < x.m);
  document.getElementById('miles').innerHTML = MILES.map((x, i) => {
    const done = min >= x.m, next = i === nextIdx;
    let extra = '';
    if (next) extra = `<div class="d">あと ${left(x.m - min)}</div>`;
    return `<div class="mile ${done ? 'done' : ''} ${next ? 'next' : ''}"><span class="ic">${done ? '✅' : next ? '⏳' : '・'}</span>
      <div><div class="t">${x.t}</div><div class="d">${x.d}</div>${extra}</div></div>`;
  }).join('');
}
function left(min) {
  if (min < 60) return Math.ceil(min) + '分';
  if (min < 1440) return Math.ceil(min / 60) + '時間';
  return Math.ceil(min / 1440) + '日';
}
setInterval(() => { if (!document.getElementById('vMain').classList.contains('hide')) tick(); }, 1000);

// ===== すいたくなった！（深呼吸60秒） =====
let bTimer = null;
function startBreath() {
  document.getElementById('breath').classList.remove('hide');
  const c = document.getElementById('circle'), l = document.getElementById('left');
  let t = 60, phase = 0;
  const steps = [['すって', 4, 1.35], ['とめて', 4, 1.35], ['はいて', 6, 1]];
  let stepLeft = 0;
  const run = () => {
    if (stepLeft <= 0) {
      const [txt, len, scale] = steps[phase % 3];
      c.textContent = txt; c.style.transitionDuration = len + 's'; c.style.transform = `scale(${scale})`;
      stepLeft = len; phase++;
    }
    l.textContent = t > 0 ? t : 'できたね！';
    if (t <= 0) { clearInterval(bTimer); c.textContent = '🌱'; c.style.transform = 'scale(1)'; }
    t--; stepLeft--;
  };
  run(); clearInterval(bTimer); bTimer = setInterval(run, 1000);
}
function endBreath(won) {
  clearInterval(bTimer);
  document.getElementById('breath').classList.add('hide');
  if (won) { s.wins++; save(); tick(); toast('すごい！がまんできた ✨'); }
}

// ===== すってしまった =====
function slipped() {
  if (!confirm('記録をリセットして、今からまたスタートしますか？\n（がまんできた回数とさいちょう記録はのこります）')) return;
  const days = (Date.now() - s.start) / 86400000;
  s.best = Math.max(s.best, days);
  s.slips.push(Date.now());
  s.start = Date.now();
  save(); tick();
  toast('だいじょうぶ。ここからまたはじめよう 🌱');
}

// ===== せってい =====
function openSettings() {
  document.getElementById('ePerDay').value = s.perDay;
  document.getElementById('ePrice').value = s.price;
  document.getElementById('ePerPack').value = s.perPack;
  document.getElementById('eGoalName').value = s.goalName || '';
  document.getElementById('eGoalPrice').value = s.goalPrice || '';
  show('vSettings');
}
function saveSettings() {
  if (num('ePerDay') <= 0 || num('ePrice') <= 0 || num('ePerPack') <= 0) return toast('本数と値段をいれてね');
  s.perDay = num('ePerDay'); s.price = num('ePrice'); s.perPack = num('ePerPack');
  s.goalName = document.getElementById('eGoalName').value.trim(); s.goalPrice = num('eGoalPrice');
  save(); toast('ほぞんしました'); show('vMain');
}
function resetAll() {
  if (!confirm('すべてのデータをけします。よろしいですか？')) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.style.display = 'none', 2000);
}

// ===== 起動 =====
if (s && s.start) show('vMain');
else { document.getElementById('sStart').value = toLocalInput(Date.now()); show('vSetup'); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
