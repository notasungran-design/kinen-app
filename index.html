<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>smoking</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="smoking">
<meta name="theme-color" content="#FFFFFF">
<style>
  /* ===== フォント（Zen Maru Gothic：読みやすい丸ゴシック） ===== */
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

  /* ===== 色（白ベース・黒文字） ===== */
  :root {
    --paper: #FFFFFF;
    --ink:   #3F2A27;
    --sub:   #7A6360;
    --soft:  #F2F2F2;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; font-weight: 700; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 18px 48px; }
  .hide { display: none !important; }
  .note { font-size: .82rem; color: var(--sub); line-height: 1.7; font-weight: 500; }

  /* ===== 手描きの枠（太いマーカーの線・1本） ===== */
  .hd { position: relative; padding: 16px 18px; margin-bottom: 16px; background: transparent; }
  .hd::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 3.5px solid var(--ink); border-radius: var(--r, 14px 20px 12px 22px / 20px 12px 22px 14px); filter: url(#rough); }
  .hd::after { content: none; }
  .oval { --r: 50%; }
  .pill { --r: 999px; }
  .tilt-l { transform: rotate(-.6deg); }
  .tilt-r { transform: rotate(.5deg); }

  /* ===== 見出し：マーカーの下線 ===== */
  h1 { margin: 0; }
  .logo { display: block; width: 120px; margin: 0 auto 6px; }
  h2 { font-size: 1.1rem; font-weight: 900; margin: 30px 0 14px; display: inline-block; position: relative; }
  h2::after { content: ""; position: absolute; left: -2px; right: -4px; bottom: -6px; height: 4px;
    background: var(--ink); border-radius: 4px; transform: rotate(-.8deg); }

  /* ===== すわずに◯日 ===== */
  .hero { text-align: center; padding: 34px 20px 30px; margin: 10px 4px 22px; }
  .hero .lbl { font-size: 1rem; color: var(--sub); }
  .hero .days { font-size: 4.6rem; font-weight: 900; line-height: 1; margin: 6px 0 4px; }
  .hero .days small { font-size: 1.4rem; margin-left: 4px; }
  .hero .clock { font-size: 1.35rem; letter-spacing: .06em; font-variant-numeric: tabular-nums; }

  /* ===== 4つの数字 ===== */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat { text-align: center; padding: 16px 8px; margin: 0; }
  .stat .v { font-size: 1.7rem; font-weight: 900; }
  .stat .l { font-size: .8rem; color: var(--sub); font-weight: 500; margin-top: 2px; }

  /* ===== ごほうび目標 ===== */
  .goal .bar { position: relative; height: 20px; margin: 10px 0 6px; }
  .goal .bar::before { content: ""; position: absolute; inset: 0; border: 3px solid var(--ink); border-radius: 12px; filter: url(#rough); }
  .goal .bar i { position: absolute; left: 4px; top: 4px; bottom: 4px; display: block; border-radius: 8px;
    background: var(--ink); transition: width .5s; }

  /* ===== ボタン ===== */
  button { font-family: inherit; font-weight: 700; font-size: 1.05rem; color: var(--ink); background: transparent;
    border: none; padding: 16px; width: 100%; cursor: pointer; }
  button.hd { margin: 12px 0 0; }
  .craving { font-size: 1.35rem; font-weight: 900; padding: 22px; margin-top: 20px !important;
    background: var(--ink); color: #fff; border-radius: 999px; }
  .primary { background: var(--ink); color: #fff; border-radius: 16px 22px 14px 24px / 22px 14px 24px 16px; margin-top: 16px; }
  .ghost { color: var(--sub); font-size: .95rem; text-decoration: underline; text-underline-offset: 4px; padding: 12px; }
  button:active { transform: scale(.98); }

  /* ===== からだの回復のめやす：手描きの丸 ===== */
  .mile { display: flex; gap: 14px; align-items: flex-start; padding: 10px 0; }
  .chk { position: relative; width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 900; color: #fff; }
  .chk::before { content: ""; position: absolute; inset: 0; border: 3px solid var(--ink); border-radius: 50%; filter: url(#rough); z-index: -1; }
  .mile.done .chk::before { background: var(--ink); }          /* たっせい：黒くぬりつぶし＋白い✓ */
  .mile.next .chk::before { border-style: dashed; }             /* つぎの目標：点線の丸 */
  .mile .t { font-size: 1rem; font-weight: 900; }
  .mile .d { font-size: .88rem; color: var(--sub); font-weight: 500; line-height: 1.6; }
  .mile.done .t, .mile.done .d { color: #999; }
  .mile.next .t::after { content: " ← いまここ"; font-size: .82rem; }

  /* ===== 入力欄 ===== */
  label { display: block; font-size: .95rem; margin: 16px 0 6px; }
  input { font-family: inherit; font-weight: 700; font-size: 1.1rem; width: 100%; padding: 10px 4px; color: var(--ink);
    background: transparent; border: none; border-bottom: 3px solid var(--ink); border-radius: 0; outline: none; }
  input:focus { border-bottom-color: #777; }

  /* ===== 深呼吸 ===== */
  #breath { position: fixed; inset: 0; background: var(--paper); z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .circle { width: 190px; height: 190px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 900;
    background: var(--soft); border-radius: 50%; transition: transform 4s ease-in-out; }
  #breath .left { font-size: 1.3rem; margin-top: 34px; color: var(--sub); }
  #breath .tips { font-size: .92rem; color: var(--sub); font-weight: 500; margin-top: 18px; line-height: 1.9; }
  #breath button { max-width: 300px; }

  #toast { position: fixed; left: 50%; top: calc(20px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; display: none; z-index: 30; }
</style>
</head>
<body>
<!-- 手描きの線をゆらすフィルター -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<div id="toast"></div>
<div class="wrap">
  <h1><img class="logo" src="logo.png" alt="NO SMOKING"></h1>

  <!-- ===== はじめての設定 ===== -->
  <section id="vSetup" class="hide">
    <div class="hd tilt-l">
      <label>やめた日時</label>
      <input id="sStart" type="datetime-local">
      <label>1日にすっていた本数</label>
      <input id="sPerDay" type="number" inputmode="numeric" value="20">
      <label>1箱の値段（円）</label>
      <input id="sPrice" type="number" inputmode="numeric" value="600">
      <label>1箱の本数</label>
      <input id="sPerPack" type="number" inputmode="numeric" value="20">
      <label>ごほうび目標（なくてもOK）</label>
      <input id="sGoalName" placeholder="例：新しいスニーカー">
      <input id="sGoalPrice" type="number" inputmode="numeric" placeholder="金額（円）" style="margin-top:10px">
    </div>
    <button class="primary" onclick="saveSetup()">スタート</button>
    <p class="note">※データはこのスマホの中だけに保存されます。</p>
  </section>

  <!-- ===== メイン ===== -->
  <section id="vMain" class="hide">
    <div class="hd oval hero">
      <div class="lbl">Smoke-free for</div>
      <div class="days"><span id="days">0</span><small>日</small></div>
      <div class="clock" id="clock">00:00:00</div>
    </div>

    <div class="stats">
      <div class="hd stat tilt-l"><div class="v" id="saved">¥0</div><div class="l">うかせたお金</div></div>
      <div class="hd stat tilt-r"><div class="v" id="notSmoked">0本</div><div class="l">すわなかった本数</div></div>
      <div class="hd stat tilt-r"><div class="v" id="win">0回</div><div class="l">がまんできた回数</div></div>
      <div class="hd stat tilt-l"><div class="v" id="best">0日</div><div class="l">さいちょう記録</div></div>
    </div>

    <div class="hd goal" id="goalBox" style="margin-top:18px">
      <div>🎁 <span id="goalName"></span></div>
      <div class="bar"><i id="goalBar" style="width:0"></i></div>
      <div class="note" id="goalText"></div>
    </div>

    <button class="hd pill craving" onclick="startBreath()">すいたいかも！</button>

    <h2>からだの回復のめやす</h2>
    <div id="miles"></div>
    <p class="note">※WHOなどが紹介している一般的なめやすです。個人差があります。</p>

    <button class="hd" onclick="openSettings()">設定</button>
    <button class="ghost" onclick="slipped()">吸っちゃった…</button>
  </section>

  <!-- ===== せってい ===== -->
  <section id="vSettings" class="hide">
    <div class="hd tilt-r">
      <label>1日にすっていた本数</label>
      <input id="ePerDay" type="number" inputmode="numeric">
      <label>1箱の値段（円）</label>
      <input id="ePrice" type="number" inputmode="numeric">
      <label>1箱の本数</label>
      <input id="ePerPack" type="number" inputmode="numeric">
      <label>ごほうび目標</label>
      <input id="eGoalName" placeholder="例：新しいスニーカー">
      <input id="eGoalPrice" type="number" inputmode="numeric" placeholder="金額（円）" style="margin-top:10px">
    </div>
    <button class="primary" onclick="saveSettings()">保存して戻る</button>
    <button class="ghost" onclick="show('vMain')">キャンセル</button>
    <button class="ghost" style="color:#C0392B" onclick="resetAll()">すべてのデータをけす</button>
  </section>
</div>

<!-- ===== 深呼吸 ===== -->
<div id="breath" class="hide">
  <div class="circle hd oval" id="circle">吸って</div>
  <div class="left" id="left">60</div>
  <div class="tips">吸いたい気持ちは、たいてい数分でおさまります。<br>水をのむ・歯をみがく・少し歩く、もおすすめ。</div>
  <button class="primary" onclick="endBreath(true)">のりこえた！</button>
  <button class="ghost" onclick="endBreath(false)">close</button>
</div>

<script>
const KEY = 'kinen-v1';
// からだの回復のめやす（分）
const MILES = [
  { m: 20, t: '20分', d: '心拍数と血圧が下がりはじめる' },
  { m: 60 * 12, t: '12時間', d: '血液中の一酸化炭素がふつうのレベルにもどる' },
  { m: 60 * 24 * 14, t: '2週間〜3か月', d: '血のめぐりがよくなり、肺のはたらきが高まる' },
  { m: 60 * 24 * 30, t: '1〜9か月', d: 'せきや息切れがへっていく' },
  { m: 60 * 24 * 365, t: '1年', d: '心臓病のリスクが、すっている人の約半分に' },
  { m: 60 * 24 * 365 * 5, t: '5年', d: '脳卒中のリスクが下がっていく' },
  { m: 60 * 24 * 365 * 10, t: '10年', d: '肺がんで亡くなるリスクが、すっている人の約半分に' },
];

let s = load();
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { toast('ほぞんできませんでした'); } }

function show(id) {
  ['vSetup', 'vMain', 'vSettings'].forEach(v => document.getElementById(v).classList.toggle('hide', v !== id));
  if (id === 'vMain') tick();
  window.scrollTo(0, 0);
}

// ===== はじめての設定 =====
function toLocalInput(t) {
  const d = new Date(t - new Date().getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
}
function num(id) { return parseFloat(document.getElementById(id).value) || 0; }
function saveSetup() {
  const start = new Date(document.getElementById('sStart').value).getTime();
  if (!start || start > Date.now()) return toast('やめた日時をたしかめてね');
  if (num('sPerDay') <= 0 || num('sPrice') <= 0 || num('sPerPack') <= 0) return toast('本数と値段をいれてね');
  s = {
    start, perDay: num('sPerDay'), price: num('sPrice'), perPack: num('sPerPack'),
    goalName: document.getElementById('sGoalName').value.trim(), goalPrice: num('sGoalPrice'),
    wins: 0, best: 0, slips: [],
  };
  save(); show('vMain');
}

// ===== 毎秒の表示 =====
const yen = n => '¥' + Math.floor(n).toLocaleString('ja-JP');
function tick() {
  if (!s) return;
  const ms = Math.max(0, Date.now() - s.start);
  const days = ms / 86400000;
  const sec = Math.floor(ms / 1000);
  document.getElementById('days').textContent = Math.floor(days);
  document.getElementById('clock').textContent =
    [Math.floor(sec / 3600) % 24, Math.floor(sec / 60) % 60, sec % 60].map(n => String(n).padStart(2, '0')).join(':');

  const cigs = days * s.perDay;
  const money = cigs * s.price / s.perPack;
  document.getElementById('saved').textContent = yen(money);
  document.getElementById('notSmoked').textContent = Math.floor(cigs).toLocaleString('ja-JP') + '本';
  document.getElementById('win').textContent = s.wins + '回';
  document.getElementById('best').textContent = Math.floor(Math.max(s.best, days)) + '日';

  // ごほうび目標
  const g = document.getElementById('goalBox');
  if (s.goalName && s.goalPrice > 0) {
    g.classList.remove('hide');
    const r = Math.min(1, money / s.goalPrice);
    document.getElementById('goalName').textContent = s.goalName;
    document.getElementById('goalBar').style.width = (r * 100) + '%';
    document.getElementById('goalText').textContent = r >= 1
      ? `${yen(s.goalPrice)} たまりました！ごほうびを買いにいこう 🎉`
      : `${yen(money)} / ${yen(s.goalPrice)}（あと ${yen(Math.ceil(s.goalPrice - money))}・約${Math.ceil((s.goalPrice - money) / (s.perDay * s.price / s.perPack))}日）`;
  } else g.classList.add('hide');

  // 回復のめやす
  const min = ms / 60000;
  const nextIdx = MILES.findIndex(x => min < x.m);
  document.getElementById('miles').innerHTML = MILES.map((x, i) => {
    const done = min >= x.m, next = i === nextIdx;
    let extra = '';
    if (next) extra = `<div class="d">あと ${left(x.m - min)}</div>`;
    return `<div class="mile ${done ? 'done' : ''} ${next ? 'next' : ''}"><span class="chk">${done ? '✓' : ''}</span>
      <div><div class="t">${x.t}</div><div class="d">${x.d}</div>${extra}</div></div>`;
  }).join('');
}
function left(min) {
  if (min < 60) return Math.ceil(min) + '分';
  if (min < 1440) return Math.ceil(min / 60) + '時間';
  return Math.ceil(min / 1440) + '日';
}
setInterval(() => { if (!document.getElementById('vMain').classList.contains('hide')) tick(); }, 1000);

// ===== すいたくなった！（深呼吸60秒） =====
let bTimer = null;
function startBreath() {
  document.getElementById('breath').classList.remove('hide');
  const c = document.getElementById('circle'), l = document.getElementById('left');
  let t = 60, phase = 0;
  const steps = [['すって', 4, 1.35], ['とめて', 4, 1.35], ['はいて', 6, 1]];
  let stepLeft = 0;
  const run = () => {
    if (stepLeft <= 0) {
      const [txt, len, scale] = steps[phase % 3];
      c.textContent = txt; c.style.transitionDuration = len + 's'; c.style.transform = `scale(${scale})`;
      stepLeft = len; phase++;
    }
    l.textContent = t > 0 ? t : 'できたね！';
    if (t <= 0) { clearInterval(bTimer); c.textContent = '🌱'; c.style.transform = 'scale(1)'; }
    t--; stepLeft--;
  };
  run(); clearInterval(bTimer); bTimer = setInterval(run, 1000);
}
function endBreath(won) {
  clearInterval(bTimer);
  document.getElementById('breath').classList.add('hide');
  if (won) { s.wins++; save(); tick(); toast('すごい！がまんできた ✨'); }
}

// ===== すってしまった =====
function slipped() {
  if (!confirm('記録をリセットして、今からまたスタートしますか？\n（がまんできた回数とさいちょう記録はのこります）')) return;
  const days = (Date.now() - s.start) / 86400000;
  s.best = Math.max(s.best, days);
  s.slips.push(Date.now());
  s.start = Date.now();
  save(); tick();
  toast('だいじょうぶ。ここからまたはじめよう ');
}

// ===== せってい =====
function openSettings() {
  document.getElementById('ePerDay').value = s.perDay;
  document.getElementById('ePrice').value = s.price;
  document.getElementById('ePerPack').value = s.perPack;
  document.getElementById('eGoalName').value = s.goalName || '';
  document.getElementById('eGoalPrice').value = s.goalPrice || '';
  show('vSettings');
}
function saveSettings() {
  if (num('ePerDay') <= 0 || num('ePrice') <= 0 || num('ePerPack') <= 0) return toast('本数と値段をいれてね');
  s.perDay = num('ePerDay'); s.price = num('ePrice'); s.perPack = num('ePerPack');
  s.goalName = document.getElementById('eGoalName').value.trim(); s.goalPrice = num('eGoalPrice');
  save(); toast('保存OK'); show('vMain');
}
function resetAll() {
  if (!confirm('すべてのデータをけします。よろしいですか？')) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.style.display = 'none', 2000);
}

// ===== 起動 =====
if (s && s.start) show('vMain');
else { document.getElementById('sStart').value = toLocalInput(Date.now()); show('vSetup'); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<!-- ===== 手書きパーツ（Canvaで作った枠）ここから ===== -->
<style>
  /* 大きいだ円：top.png（「smoke free for」の文字も画像に入っています） */
  #vMain .hd.hero { background: url("top-brown.png") center / 100% 100% no-repeat, var(--paper);
    aspect-ratio: 1000 / 620; padding: 24% 0 0; margin: 6px 0 20px; border-radius: 0; }
  #vMain .hd.hero::before { display: none; }
  #vMain .hero .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #vMain .hero .days { font-size: 3.8rem; margin: 0; }
  #vMain .hero .clock { font-size: 1.2rem; margin-top: 2px; }

  /* 4つの数字の枠：box.png */
  #vMain .hd.stat { background: url("box.png") center / 100% 100% no-repeat, var(--paper);
    aspect-ratio: 600 / 400; border-radius: 0; display: flex; flex-direction: column; justify-content: center; padding: 6px; }
  #vMain .hd.stat::before { display: none; }
</style>
<!-- ===== 手書きパーツ（ここまで） ===== -->

<!-- ===== ステッカー風の枠（ここから） ===== -->
<style>
  /* 共通：色つきの形をうしろに敷いて、すみに小さな飾りをのせる */
  #vMain .stats .stat, #vMain #goalBox, #vMain .craving {
    position: relative; border-radius: 0; aspect-ratio: auto; overflow: visible;
    background-color: transparent !important; background-repeat: no-repeat; background-size: 100% 100%; background-position: center; }
  #vMain .stats .stat::before, #vMain #goalBox::before, #vMain .craving::before { display: none; }
  #vMain .stats .stat::after, #vMain #goalBox::after, #vMain .craving::after {
    content: ""; position: absolute; width: 42px; height: 42px; opacity: 1; border: none; filter: none;
    background: var(--acc) center / contain no-repeat; pointer-events: none; inset: auto; }
  #vMain .stats { gap: 18px 16px; }
  #vMain .stats .stat { padding: 20px 10px; min-height: 104px; display: flex; flex-direction: column; justify-content: center; }
  #vMain .stat .v { font-size: 1.75rem; font-weight: 900; }
  #vMain .stat .l { font-weight: 700; opacity: .9; }
  #vMain #goalBox { padding: 20px 22px 18px; margin-top: 26px !important; }
  #vMain #goalBox .note { color: inherit; opacity: .85; font-weight: 700; }
  #vMain #goalBox .bar::before { border-color: #3F2A27; background: rgba(255,255,255,.5); }

<style>
  /* ひらいたとき：上から順にふわっと出てくる */

  body.enter #vMain > *:nth-child(4) { animation-delay: .24s; }
  body.enter #vMain > *:nth-child(n+5) { animation-delay: .32s; }

  #vMain .stats .stat:nth-child(4) { animation-delay: -3.6s; }

  /* 飾り（花火・花など）がゆっくり回る */
  @keyframes spin { to { rotate: 360deg; } }
  #vMain .stats .stat::after, #vMain #goalBox::after { animation: spin 24s linear infinite; }

  /* ごほうびのバーが、ひらいたときにのびる */

  /* 「すいたいかも！」ボタンが、深呼吸のようにゆっくりふくらむ */
  @keyframes breathe { 0%,100% { scale: 1; } 50% { scale: 1.025; } }
  #vMain .craving { animation: breathe 5s ease-in-out infinite; }

  /* 深呼吸の丸から、波紋がひろがる */
  @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(198,220,241,.9); } 100% { box-shadow: 0 0 0 36px rgba(198,220,241,0); } }
  #breath .circle { animation: ripple 2.4s ease-out infinite; }

  /* 数字が増えたときに、ぽんっ */
  @keyframes bump { 0% { scale: 1; } 40% { scale: 1.12; } 100% { scale: 1; } }
  .bump { animation: bump .6s ease-out; display: inline-block; }

  /* 新しく達成した「めやす」をしばらく光らせる */

  .mile.just { background: rgba(251,232,166,.55); border-radius: 12px; transition: background 1s; }

<canvas id="sparkle"></canvas>
<script>
(function () {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS = ['#7A0F14', '#FBE8A6', '#C6DCF1', '#3F2A27'];

  // ひらいたときのふわっと
  document.body.classList.add('enter');
  setTimeout(() => document.body.classList.remove('enter'), 2200);

  // ===== 小さなキラキラ（お祝い用・控えめ） =====
  const cv = document.getElementById('sparkle'), ctx = cv.getContext('2d');
  let ps = [], run = false;
  const fit = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; };
  addEventListener('resize', fit); fit();
  function sparkle(el) {
    if (reduce || !el) return;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.5;
      ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, r: 2 + Math.random() * 3, c: COLORS[i % 4], life: 1 });
    }
    if (!run) { run = true; requestAnimationFrame(step); }
  }
  function step() {
    const d = devicePixelRatio; ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.vy += .06; p.x += p.vx; p.y += p.vy; p.life -= .018;
      ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x * d, p.y * d, p.r * d, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ps = ps.filter(p => p.life > 0);
    if (ps.length) requestAnimationFrame(step); else { run = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  function bump(el) { if (!el || reduce) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  // ===== 数字が増えたとき（日数・がまんできた回数） =====
  function watchNumber(id, celebrate) {
    const el = document.getElementById(id); if (!el) return;
    let last = parseInt(el.textContent, 10);
    new MutationObserver(() => {
      const v = parseInt(el.textContent, 10);
      if (!isNaN(last) && v > last) { bump(el); if (celebrate) sparkle(el); }
      last = v;
    }).observe(el, { childList: true, characterData: true, subtree: true });
  }
  watchNumber('days', true);
  watchNumber('win', true);

  // ===== 新しく「めやす」を達成したとき =====
  const miles = document.getElementById('miles');
  let doneCount = null, justIdx = -1, justUntil = 0;
  if (miles) new MutationObserver(() => {
    const rows = miles.querySelectorAll('.mile'), done = miles.querySelectorAll('.mile.done').length;
    if (doneCount !== null && done > doneCount) {
      justIdx = done - 1; justUntil = Date.now() + 4000;
      const t = rows[justIdx] && rows[justIdx].querySelector('.t');
      if (t && typeof toast === 'function') toast('🎉 ' + t.textContent + ' たっせい！');
      sparkle(rows[justIdx]);
    }
    doneCount = done;
    if (Date.now() < justUntil && rows[justIdx]) rows[justIdx].classList.add('just');
  }).observe(miles, { childList: true });
})();
</script>

    { d: 1,   top: '1',   unit: '日',   title: '1日 すわずにいられました！',   msg: 'いちばん大変な最初の24時間をこえました。まずは自分をほめてあげてください。' },
    { d: 3,   top: '3',   unit: '日',   title: '3日 つづきました！',           msg: '最初の山場をこえました。すいたい気持ちの波も、少しずつ小さくなっていきます。' },
    { d: 7,   top: '1',   unit: '週間', title: '1週間 すわずにいられました！', msg: 'すごい、1週間です。この調子で、自分のペースで。' },
    { d: 14,  top: '2',   unit: '週間', title: '2週間 たっせい！',             msg: '毎日のリズムが、少しずつ新しい習慣になってきています。' },
    { d: 30,  top: '1',   unit: 'か月', title: '1か月 たっせい！',             msg: '1か月つづけられた自分に、ごほうびをあげましょう。' },
    { d: 90,  top: '3',   unit: 'か月', title: '3か月 たっせい！',             msg: '季節がひとつ変わるあいだ、すわずにいられました。' },
    { d: 180, top: '半年', unit: '',    title: '半年 たっせい！',               msg: 'ここまで来たら、もう立派な「すわない人」です。' },
    { d: 365, top: '1',   unit: '年',   title: '1年 たっせい！',               msg: '1年間、本当におつかれさまでした。心からおめでとうございます。' },
  ];
  const COLORS = [['#C6DCF1', '#7A0F14'], ['#FBE8A6', '#3F2A27'], ['#7A0F14', '#FBE8A6'], ['#3F2A27', '#C6DCF1']];
  const yenFmt = n => '¥' + Math.floor(n).toLocaleString('ja-JP');

  // 光のすじ
  document.getElementById('celeRays').innerHTML = Array.from({ length: 16 }, (_, i) => {
    const a = i * Math.PI / 8, r1 = 34, r2 = i % 2 ? 44 : 49;
    return `<line x1="${50 + r1 * Math.cos(a)}" y1="${50 + r1 * Math.sin(a)}" x2="${50 + r2 * Math.cos(a)}" y2="${50 + r2 * Math.sin(a)}"/>`;
  }).join('');

  // バッジ一覧の場所をつくる（「からだの回復のめやす」の上）
  const h2s = [...document.querySelectorAll('#vMain h2')];
  const anchor = h2s.find(h => h.textContent.includes('回復')) || h2s[0];
  const title = document.createElement('h2'); title.textContent = 'ごほうびバッジ';
  const grid = document.createElement('div'); grid.className = 'badges'; grid.id = 'badges';
  if (anchor) { anchor.before(title); anchor.before(grid); }

  function savedAt(days) { return days * s.perDay * s.price / s.perPack; }

  function drawGrid() {
    if (!s || !s.start) return;
    const got = s.badges || {};
    grid.innerHTML = BADGES.map((b, i) => {
      const [bg, fg] = COLORS[i % 4], on = !!got[b.d];
      return `<button class="badge ${on ? 'on' : 'off'}" style="background:${bg};color:${fg}" ${on ? `onclick="window.__showBadge(${i})"` : ''}>
        ${b.top}<small>${b.unit || '&nbsp;'}</small></button>`;
    }).join('');
  }

  function show(i) {
    const b = BADGES[i], [bg, fg] = COLORS[i % 4];
    const el = document.getElementById('celeBadge');
    el.style.background = bg; el.style.color = fg;
    el.innerHTML = `${b.top}<small>${b.unit}</small>`;
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    document.getElementById('celeTitle').textContent = b.title;
    document.getElementById('celeMsg').textContent = b.msg;
    document.getElementById('celeSaved').textContent = `この${b.top}${b.unit}で うかせたお金 ${yenFmt(savedAt(b.d))}`;
    document.getElementById('celeGoal').textContent = s.goalName
      ? `「${s.goalName}」にも、ちゃくちゃく近づいています 🎁` : '好きなものを買ったり、おいしいものを食べたり。自分にごほうびを。';
    document.getElementById('cele').classList.remove('hide');
  }
  window.__showBadge = show;

  // 新しくたっせいしたバッジがないか、ときどきチェック
  function check() {
    if (!s || !s.start) return;
    s.badges = s.badges || {};
    const days = (Date.now() - s.start) / 86400000;
    let newest = -1;
    BADGES.forEach((b, i) => { if (days >= b.d && !s.badges[b.d]) { s.badges[b.d] = Date.now(); newest = i; } });
    if (newest >= 0) { save(); show(newest); }
    drawGrid();
  }
  check();
  setInterval(check, 5000);
})();
</script>
